# Aurora Agent Recipes
#
# Portable component recipe library. Any AI coding agent reads this to build
# Aurora components consistently across platforms. Tokens are referenced by name,
# not by framework-specific classes.
#
# Source of truth: design-tokens/aurora.tokens.json
#                  Figma Aurora App DS (jD7tZtVeQCMRlIHN7L8umI)
#                  Figma Aurora Web DS (2ltwLvqwn6hSKN15ZR9gxB)
# Policy:          aurora.policy.json
# Docs:            TOKENS.md, CLAUDE.md

version: 3
design_system: aurora
non_destructive: true

# ====================================================================
# CTA — enforced via .aurora-cta utility classes
# ====================================================================
# All four levels share: Inter · 700 · UPPERCASE · 0.5px tracking. The utility
# class bakes these in so agents cannot forget them. Agents SHOULD use the
# utility class — not compose raw Tailwind / inline styles.

cta_rule:
  source: "Figma Aurora App Design System / Buttons page"
  enforcement: "Use the .aurora-cta utility classes in styles/components/cta.css"
  allowed_utility_classes:
    - aurora-cta
    - aurora-cta--primary
    - aurora-cta--secondary
    - aurora-cta--tertiary
    - aurora-cta-twins
    - aurora-cta--sm           # size modifier
  forbidden_patterns:
    - bg-curefit-yellow         # brand primitives must not be CTA bg
    - bg-curefit-blue
    - bg-curefit-green
    - bg-curefit-pink
    - "textTransform: 'none'"   # never opt out of uppercase
  levels:
    primary:
      dark: "white bg, gradient text (yellow→pink). 50px (Big) / 40px (Small). min-width 120, max-width 335."
      white: "gradient bg, white text (inverted)."
    secondary: "glass (10% white + 30px blur), white text. States: active/disabled/booked/waitlist/waitlisted/full/negative."
    tertiary:  "transparent, white text. 40px / 30px. No container."
    twins:     "row of Secondary (left) + Primary-gradient (right). 50px or 40px."
  label_casing: "Write labels lowercase in source. CSS transforms to UPPERCASE."

principles:
  - Pick tier in order — utility class, then semantic token, then primitive. Never hex.
  - CTAs use .aurora-cta utility — the uppercase/tracking/weight are baked in.
  - Cards are glass by default — use .aurora-card or bg-[var(--color-bg-card)].
  - Spacing on the 5px rhythm only (--spacing-1..30).
  - Radius from the scale (--radius-*). Motion from --duration-* + --easing-*.
  - Fonts restricted to Inter / Bw Modelica SS01 / Roboto Mono / Bebas Neue.
  - Both themes (dark default, .theme-white) preserve brand colors.

recipes:

  card:
    description: Default card surface — glass (10% white + 30px blur).
    apply:
      class: aurora-card
    equivalent_tokens:
      background: color.bg.card                # rgba(255,255,255,0.10) dark / rgba(255,255,255,0.60) white
      backdrop_filter: blur(var(--card-backdrop-blur))
      radius: radius.card                      # 10px
    content_padding: spacing.4                 # 20px

  cta_primary:
    description: Highest-priority CTA. White bg + gradient text on dark; gradient bg + white text on white.
    apply:
      class: "aurora-cta aurora-cta--primary"
      size_small: "aurora-cta--sm"
    label_format: lowercase
    tokens:
      height_lg: cta.primary.height-lg         # 50px
      height_sm: cta.primary.height-sm         # 40px
      max_width: cta.primary.max-width         # 335px
      radius:    cta.primary.radius            # 5px
      gradient:  cta.gradient                  # yellow → pink

  cta_secondary:
    description: Glass SKU/banner button with state variants.
    apply:
      class: "aurora-cta aurora-cta--secondary"
      states:
        booked:     "is-booked"
        waitlist:   "is-waitlist"
        waitlisted: "is-waitlisted"
        full:       "is-full"
        negative:   "is-negative"
    label_format: lowercase
    tokens:
      background: cta.secondary.bg             # rgba(255,255,255,0.10)
      backdrop_filter: blur(var(--cta-secondary-backdrop-blur))
      text:       cta.secondary.text           # #FFFFFF

  cta_tertiary:
    description: Plain label — transparent, white text.
    apply:
      class: "aurora-cta aurora-cta--tertiary"
    label_format: lowercase

  cta_twins:
    description: Row of two CTAs — left=Secondary, right=Primary with gradient bg.
    apply:
      container_class: "aurora-cta-twins"
      left_class:  "aurora-cta aurora-cta--secondary"
      right_class: "aurora-cta aurora-cta--primary"

  chip:
    description: Pill-shaped tag.
    tokens:
      background: color.white.10
      radius:     radius.chip                  # 15px
      padding:    spacing.1 spacing.3          # 5 × 15
      text_style: text-style.p8                # 12/400
      text_color: color.text.white

  modal_scrim:
    description: Backdrop behind modals / sheets.
    tokens:
      background: color.scrim                  # rgba(0,0,0,0.6)
      backdrop_filter: blur(var(--blur-sm))    # 10px
      z_index: z.modal                         # 400

  bottom_sheet:
    description: Slide-up sheet with rounded top.
    tokens:
      background: color.bg.elevated
      radius_top: radius.3xl                   # 40px on top corners only
      shadow:     shadow.modal
      z_index:    z.modal
      enter:      "duration.slow easing.spring"

  aurora_background:
    description: Three drifting blurred blobs. Globally applied via body::before, body::after, #root::before.
    tokens:
      blob_pink:    aurora-bg.blob-pink        # #FF3278
      blob_yellow:  aurora-bg.blob-yellow      # #F5BC00
      blob_blue:    aurora-bg.blob-blue        # #00BEFF
      opacity:      aurora-bg.blob-opacity     # 0.35 dark / 0.20 white theme
      blur:         blur.3xl                   # 200px
    local_scope:
      container_class: aurora-bg
      children:
        - aurora-bg-blob aurora-bg-blob--pink
        - aurora-bg-blob aurora-bg-blob--yellow
        - aurora-bg-blob aurora-bg-blob--blue

themes:
  dark:
    default: true
    bg: "#1A1A1A"
  white:
    apply_class: theme-white
    scope: "html | body | any container"
    bg: "#FAFAFA"
    preserves: [brand colors, gradient, typography, spacing, aurora-bg blobs]
    flips:     [surfaces, text, overlays, shadows, cta-primary]

compliance:
  linter: scripts/check-aurora.mjs
  command: "npm run aurora:check"
  gates: [forbidden_fonts, forbidden_hex, raw_hex_in_tsx, cta_brand_bg]
